name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK at $ANDROID_HOME; AGP pulls any
      # missing platform itself, which needs the licences accepted first.
      - name: Accept the Android SDK licences
        run: |
          # The cmdline-tools directory is versioned (16.0, latest, ...) — take whichever is there.
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$sdkmanager" ]; then yes | "$sdkmanager" --licenses > /dev/null || true; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Build the debug APK
        run: ./gradlew assembleDebug

      # The debug APK is signed with the standard debug key, so it installs on a
      # device straight away — download it from this run's Artifacts section.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: parkspot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
