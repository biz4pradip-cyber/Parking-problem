name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Build the debug APK
        run: ./gradlew assembleDebug

      # The debug APK is signed with the standard debug key, so it installs on a
      # device straight away — download it from this run's Artifacts section.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: parkspot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
